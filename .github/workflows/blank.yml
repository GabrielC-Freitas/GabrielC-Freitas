name: Validate profile

on:
  push:
    paths:
      - README.md
      - assets/**
      - .github/workflows/blank.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout profile
        uses: actions/checkout@v4
      - name: Validate self-contained profile assets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import xml.etree.ElementTree as ET
          readme = Path("README.md").read_text(encoding="utf-8")
          assert "github-readme-stats.vercel.app" not in readme, "Avoid fragile remote statistic cards"
          for asset in re.findall(r'src="\./([^"]+)"', readme):
              assert Path(asset).is_file(), f"Missing asset: {asset}"
          for asset in Path("assets").glob("*.svg"):
              ET.parse(asset)
          print("README assets and SVG structure validated.")
          PY
